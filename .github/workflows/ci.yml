name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cups cups-ipp-utils poppler-utils qpdf
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile Python files
        run: PYTHONPATH=src python -m compileall src scripts tests
      - name: Check Docker entrypoint syntax
        run: sh -n docker/entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t hundred-percent-print:test .
