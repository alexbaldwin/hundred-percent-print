# Fallback Synology deployment.
#
# Prefer compose.synology-macvlan.yml when possible. Host networking shares
# the NAS network namespace, so it can conflict with any existing service that
# already uses CUPS port 631 or mDNS port 5353.

name: hundred-percent-print

services:
  hundred-percent-print:
    image: ghcr.io/alexbaldwin/hundred-percent-print:latest
    container_name: hundred-percent-print
    network_mode: host
    restart: unless-stopped
    environment:
      HPP_UPSTREAM_DEVICE_URI: "ipp://192.168.1.50/ipp/print"
      HPP_UPSTREAM_QUEUE: "Canon_TR150_series"
      HPP_MEDIA: "Letter"
      HPP_PAGE_SIZE: "Letter"
      HPP_AIRPRINT_NAME: "100 Percent Pattern Print SAFE"
      HPP_KEEP_SPOOL: "1"
      HPP_ALLOW_OFFLINE_START: "1"
      HPP_UPSTREAM_RETRY_SECONDS: "30"
      HPP_START_AVAHI: "0"
    volumes:
      - ./data:/data
      # Publish through DSM's existing Avahi daemon instead of starting a
      # second mDNS responder in the shared host network namespace.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
